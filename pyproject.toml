[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferspec"
version = "0.3.0a0"
description = "Development-Driven Spec (DDS) — reverse-infer OpenSpec specs from code + git history + docs. The inverse of SDD, for brownfield repos."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "anrylu" }]
keywords = [
    "spec",
    "openspec",
    "spec-driven-development",
    "sdd",
    "dds",
    "development-driven-spec",
    "reverse-engineering",
    "brownfield",
    "legacy-code",
    "documentation-generator",
    "ai",
    "agent",
    "agentic",
    "claude",
    "claude-code",
    "claude-skill",
    "gemini",
    "copilot",
    "codex",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/anrylu/infer-spec"
Repository = "https://github.com/anrylu/infer-spec"
Issues = "https://github.com/anrylu/infer-spec/issues"

[project.scripts]
inferspec = "inferspec.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/inferspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
